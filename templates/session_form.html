{% extends "base.html" %}
{% block content %}
<h2>{{ 'Edit session ' ~ session.session_id if session and session.session_id else 'New session' }}</h2>
<form method="post">
  <label>Conference
    <select name="conference_id">
      {% for c in conferences %}
      <option value="{{ c.conference_id }}" {{ 'selected' if (submitted and submitted.conference_id|string == c.conference_id|string) or (not submitted and session and session.conference_id == c.conference_id) }}>{{ c.acronym }} ({{ c.city }})</option>
      {% endfor %}
    </select>
  </label>
  <label>Title <input name="title" value="{{ submitted.title if submitted else (session.title if session else '') }}" required></label>
  <label>Date <input name="session_date" type="date" value="{{ submitted.session_date if submitted else (session.session_date if session else '') }}" required></label>
  <label>Start time <input name="start_time" type="time" value="{{ submitted.start_time if submitted else (session.start_time.strftime('%H:%M') if session and session.start_time else '') }}" required></label>
  <label>End time <input name="end_time" type="time" value="{{ submitted.end_time if submitted else (session.end_time.strftime('%H:%M') if session and session.end_time else '') }}" required></label>
  <label>Room <input name="room_label" value="{{ submitted.room_label if submitted else (session.room_label if session else '') }}" required></label>
  <label>Chair (must be in the conference reviewer pool)
    <select name="chair_id">
      {% for r in reviewers %}
      <option value="{{ r.reviewer_id }}" {{ 'selected' if (submitted and submitted.chair_id|string == r.reviewer_id|string) or (not submitted and session and session.chair_id == r.reviewer_id) }}>{{ r.given_name }} {{ r.surname }} (id {{ r.reviewer_id }})</option>
      {% endfor %}
    </select>
  </label>
  <br>
  <button>Save</button>
</form>
{% endblock %}
