{% extends "base.html" %}
{% block content %}
<h2>Papers</h2>
<a href="{{ url_for('paper_form') }}">+ New paper</a>
<table>
  <tr><th>ID</th><th>Title</th><th>Status</th><th>Track</th><th>Conference</th><th>Session</th><th></th></tr>
  {% for p in papers %}
  <tr>
    <td>{{ p.paper_id }}</td>
    <td><a href="{{ url_for('paper_detail', paper_id=p.paper_id) }}">{{ p.title }}</a></td>
    <td>{{ p.status }}</td>
    <td>{{ p.track_name }}</td>
    <td>{{ p.acronym }}</td>
    <td>{{ p.session_title or '' }}</td>
    <td>
      <a href="{{ url_for('paper_form', paper_id=p.paper_id) }}">Edit</a>
      <form class="inline" method="post" action="{{ url_for('paper_delete', paper_id=p.paper_id) }}">
        <button>Delete</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
