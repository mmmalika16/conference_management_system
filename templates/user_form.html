{% extends "base.html" %}
{% block content %}
<h2>{{ 'Edit user ' ~ user.user_id if user else 'New user' }}</h2>
<form method="post">
  <label>Given name <input name="given_name" value="{{ user.given_name if user else '' }}" required></label>
  <label>Surname <input name="surname" value="{{ user.surname if user else '' }}" required></label>
  <label>Email <input name="email" type="email" value="{{ user.email if user else '' }}" required></label>
  <label>Affiliation <input name="affiliation" value="{{ user.affiliation if user else '' }}" required></label>
  <label>Country <input name="country" value="{{ user.country if user else '' }}" required></label>
  <label>Phone <input name="phone_number" value="{{ user.phone_number or '' if user else '' }}"></label>

  <h3>Author profile</h3>
  <label><input type="checkbox" name="is_author" {{ 'checked' if author }}> Is author</label>
  <label>ORCID <input name="orcid" value="{{ author.orcid or '' if author else '' }}"></label>
  <label>Research areas (comma separated) <input name="research_areas" value="{{ areas }}"></label>

  <h3>Reviewer profile</h3>
  <label><input type="checkbox" name="is_reviewer" {{ 'checked' if reviewer }}> Is reviewer</label>
  <label>Years of experience <input name="years_experience" type="number" value="{{ reviewer.years_experience if reviewer else 0 }}"></label>
  <label>Expertise (comma separated) <input name="expertise" value="{{ expertise }}"></label>
  <br>
  <button>Save</button>
</form>
{% endblock %}
